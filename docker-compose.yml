version: '3.8'

services:
  model-downloader:
    image: alpine:latest
    restart: "no"
    volumes:
      - ./models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        MODEL_FILE="/models/adapter_step_newtrain_full_learn_Q4_K_M.gguf"
        MODEL_URL="https://huggingface.co/gdgewgwe/adapter_step_newtrain_full_learn_Q4_K_M.gguf/resolve/main/adapter_step_newtrain_full_learn_Q4_K_M.gguf"
        
        mkdir -p /models
        
        if [ -f "$$MODEL_FILE" ]; then
          echo "✓ Model already exists ($$MODEL_FILE), skipping download"
          exit 0
        fi
        
        echo "Installing curl..."
        apk add --no-cache curl
        
        echo "Downloading model from HuggingFace (~4.9GB)..."
        curl -L --progress-bar -o "$$MODEL_FILE.tmp" "$$MODEL_URL"
        mv "$$MODEL_FILE.tmp" "$$MODEL_FILE"
        chmod 644 "$$MODEL_FILE"
        echo "✓ Model downloaded successfully!"

  ml-service:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Local LLM Mode (Llama) - требует 8GB+ RAM
      - USE_LOCAL_LLM=true
      - LOCAL_MODEL_PATH=/app/models/adapter_step_newtrain_full_learn_Q4_K_M.gguf
      
      # API Mode (Groq)
      # - GROQ_API_KEY=${GROQ_API_KEY}
      # - USE_LOCAL_LLM=false
    
    volumes:
      - ./models:/app/models:ro
      - training_data:/app/data
      - whisper_cache:/root/.cache/huggingface
    
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

volumes:
  whisper_cache:
  training_data: