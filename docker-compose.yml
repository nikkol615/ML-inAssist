version: '3.8'

services:
  # Сервис для скачивания модели при первом запуске
  model-downloader:
    image: alpine:latest
    volumes:
      - ./models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODEL_FILE="/models/Meta-Llama-3-8B-Instruct.Q4_K_M.gguf"
        MODEL_URL="https://huggingface.co/bartowski/Meta-Llama-3-8B-Instruct-GGUF/resolve/main/Meta-Llama-3-8B-Instruct-Q4_K_M.gguf"
        

        apk add --no-cache curl
        

        mkdir -p /models
        chmod 777 /models
        
        if [ -f "$$MODEL_FILE" ]; then
          echo "Model already exists, skipping download"
        else
          echo "Downloading model from HuggingFace (~4.9GB)..."
          curl -L --progress-bar -o "$$MODEL_FILE" "$$MODEL_URL"
          chmod 644 "$$MODEL_FILE"
          echo "Model downloaded successfully"
        fi

  ml-service:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Local LLM Mode (Llama) - требует 8GB+ RAM
      - USE_LOCAL_LLM=true
      - LOCAL_MODEL_PATH=/app/models/Meta-Llama-3-8B-Instruct.Q4_K_M.gguf
      
      # API Mode (Groq)
      # - GROQ_API_KEY=${GROQ_API_KEY}
      # - USE_LOCAL_LLM=false
    
    volumes:
      - ./models:/app/models:ro
      - ./training_data.csv:/app/training_data.csv
      - whisper_cache:/root/.cache/huggingface
    
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

volumes:
  whisper_cache:
